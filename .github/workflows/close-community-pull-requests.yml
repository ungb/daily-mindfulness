name: Close community pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  close:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain contribution policy and close
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: >-
          gh pr close "$PR_URL"
          --comment "Thanks for sharing your work. This repository accepts bug reports and suggestions through Issues, but does not accept community pull requests. You are welcome to keep and share your changes in your own fork."
